global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "email-notifications"

receivers:
  - name: "email-notifications"
    email_configs:
      - to: ${email}
        from: "alertmanager@example.com"
        smarthost: smtp.example.com:587
        auth_username: ${Username}
        auth_password: ${Password}
