global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 5s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "Elanor"
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["elanor:8080"]

  - job_name: "Prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
