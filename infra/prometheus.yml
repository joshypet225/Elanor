
global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "Elanor"
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["elanor:8080"]

  - job_name: "Prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
